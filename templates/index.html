<!DOCTYPE html>
<html>
<head>
    <title>Shrub Detector AI</title>
    <style>
        video, canvas, img { max-width: 100%; height: auto; margin: 10px 0; }
        button { padding: 10px 20px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Shrub Detection (Back Camera)</h1>

    <video id="video" autoplay playsinline></video><br>
    <button onclick="captureImage()">Capture</button>
    <canvas id="canvas" style="display:none;"></canvas>
    <form id="form" method="POST" action="/predict">
        <input type="hidden" name="image" id="imageInput">
    </form>
    <script>
        const video = document.getElementById('video');

        navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: "environment" } }, // Back camera
            audio: false
        })
        .then(stream => { video.srcObject = stream; })
        .catch(err => {
            alert("Could not access back camera. Falling back to default.");
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then(stream => { video.srcObject = stream; });
        });

        function captureImage() {
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg');
            document.getElementById('imageInput').value = dataUrl;
            document.getElementById('form').submit();
        }
    </script>
</body>
</html>
