<!DOCTYPE html>
<html>
<head>
    <title>Shrub Detection</title>
    <style>
        #webcam {
            width: 100%;
            max-width: 600px;
            border: 1px solid black;
        }
        #capture {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h2>Shrub Detection</h2>
    <video id="webcam" autoplay></video>
    <br>
    <button id="capture">Capture Image</button>
    <br>
    <canvas id="canvas" style="display:none;"></canvas>
    <br>
    <img id="resultImage" style="max-width: 300px; display:none;">
    <h3 id="predictionResult"></h3>

    <script>
        let video = document.getElementById('webcam');
        let captureButton = document.getElementById('capture');
        let canvas = document.getElementById('canvas');
        let resultImage = document.getElementById('resultImage');
        let predictionResult = document.getElementById('predictionResult');
        
        // Start the webcam (back camera for mobile)
        navigator.mediaDevices.enumerateDevices().then(devices => {
            const backCamera = devices.find(device => device.kind === 'videoinput' && device.label.includes('back'));
            if (backCamera) {
                navigator.mediaDevices.getUserMedia({
                    video: {
                        deviceId: backCamera.deviceId
                    }
                }).then(stream => {
                    video.srcObject = stream;
                }).catch(err => console.error('Error accessing camera:', err));
            } else {
                alert('Back camera not found');
            }
        });

        // Capture image and send to Flask server
        captureButton.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            let ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            let base64Image = canvas.toDataURL('image/jpeg');

            // Show captured image
            resultImage.src = base64Image;
            resultImage.style.display = 'block';

            // Send image to Flask API for prediction
            fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ image: base64Image })
            })
            .then(response => response.json())
            .then(data => {
                if (data.prediction) {
                    predictionResult.innerHTML = 'Prediction: ' + data.prediction;
                } else {
                    predictionResult.innerHTML = 'Error: ' + data.error;
                }
            })
            .catch(err => {
                console.error('Error:', err);
                predictionResult.innerHTML = 'Failed to get prediction';
            });
        });
    </script>
</body>
</html>
